# =============================================================================
# drive-sync — config para a estrutura ~/dev, ~/Documents etc.
# Local: ~/.config/drive-sync/config.yaml
# =============================================================================

rclone:
  remote_name: "proton"
  remote_root: "Sync"
  binary: "rclone"
  global_flags:
    - "--transfers=4"
    - "--checkers=8"
    - "--retries=3"
    - "--low-level-retries=10"
    - "--track-renames"

# -----------------------------------------------------------------------------
# Notas:
# - Tudo em ~/dev usa git_mode: bisync → worktree completo + .git, sem
#   node_modules/target/.venv etc. (presets automáticos cuidam disso).
# - ~/Downloads, ~/dev/forks, ~/dev/sandbox e os diretórios XDG NÃO entram.
# - ~/Pictures é dividido em 3 tarefas para isolar a varredura pesada de
#   Photos da sincronização rápida de Screenshots.
# -----------------------------------------------------------------------------
folders:

  # ---------- Código ----------
  - name: "dev-projects"
    local_path: "~/dev/projects"
    remote_subpath: "dev/projects"
    git_mode: "bisync"
    auto_exclude: true
    debounce_seconds: 15
    exclude:
      - "*.local"

  - name: "dev-scripts"
    local_path: "~/dev/scripts"
    remote_subpath: "dev/scripts"
    git_mode: "bisync"
    auto_exclude: true
    debounce_seconds: 10

  - name: "dotfiles"
    local_path: "~/dotfiles"
    remote_subpath: "dotfiles"
    git_mode: "bisync"
    auto_exclude: true
    debounce_seconds: 10

  - name: "logseq-vault"
    local_path: "~/logseq-vault"
    remote_subpath: "logseq-vault"
    git_mode: "bisync"
    auto_exclude: true
    debounce_seconds: 30                  # Logseq salva agressivamente
    exclude:
      - "logseq/.recycle/**"
      - "logseq/bak/**"
      - "logseq/version-files/**"

  # ---------- Papelada e mídia ----------
  - name: "documents"
    local_path: "~/Documents"
    remote_subpath: "Documents"
    git_mode: "off"
    auto_exclude: false
    debounce_seconds: 10
    exclude:
      - "imprimir/**"                     # transitório
      - "*.tmp"
      - "~$*"                             # locks Office/LibreOffice

  - name: "library"
    local_path: "~/Library"
    remote_subpath: "Library"
    git_mode: "off"
    auto_exclude: false
    debounce_seconds: 60                  # importações vêm em lote
    exclude:
      - "**/.zotero/**"
      - "*.tmp"

  # ---------- Imagens ----------
  - name: "pictures-photos"
    local_path: "~/Pictures/Photos"
    remote_subpath: "Pictures/Photos"
    git_mode: "off"
    auto_exclude: false
    debounce_seconds: 120                 # imports de câmera = lotes grandes
    exclude:
      - "*.tmp"
      - "**/.thumbnails/**"

  - name: "pictures-screenshots"
    local_path: "~/Pictures/Screenshots"
    remote_subpath: "Pictures/Screenshots"
    git_mode: "off"
    auto_exclude: false
    debounce_seconds: 5                   # screenshot disponível rapidamente

  - name: "pictures-assets"
    local_path: "~/Pictures/Assets"
    remote_subpath: "Pictures/Assets"
    git_mode: "off"
    auto_exclude: false
    debounce_seconds: 15

  # ---------- Vídeos ----------
  - name: "videos"
    local_path: "~/Videos"
    remote_subpath: "Videos"
    git_mode: "off"
    auto_exclude: false
    debounce_seconds: 180                 # arquivos grandes, mudanças raras
    exclude:
      - "*.tmp"
      - "*.part"

# -----------------------------------------------------------------------------
# Bundle só seria útil se você tivesse um repo gigante com .git/ pesado.
# Mantemos a seção apenas como referência — não é usada em nenhuma tarefa
# acima (todas estão em "bisync" ou "off").
# -----------------------------------------------------------------------------
git:
  bundles_dir: "~/.cache/drive-sync/bundles"
  bundle_suffix: ".gitbundle"
  bundle_all: true
  recursive_detection: true
  max_recursion_depth: 6

watcher:
  queue_size: 2000
  max_concurrent_jobs: 3
  periodic_full_sync_seconds: 3600
  startup_delay_seconds: 30

dedupe:
  skip_subpaths_of_configured_folders: true

logging:
  level: "INFO"
  file: "~/.local/state/drive-sync/drive-sync.log"
  max_bytes: 10485760                     # 10 MiB
  backup_count: 5
  console: true
