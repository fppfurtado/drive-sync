# =============================================================================
# drive-sync — arquivo de configuração
# Local padrão: ~/.config/drive-sync/config.yaml
# =============================================================================

# --- rclone -----------------------------------------------------------------
rclone:
  # Nome do remote configurado via `rclone config` (backend drive).
  remote_name: "proton"
  # Pasta-raiz dentro do Proton Drive onde tudo será espelhado.
  remote_root: "Sync"
  # Caminho do binário rclone (deixe "rclone" para usar o do PATH).
  binary: "rclone"
  # Flags globais aplicadas em todo `rclone bisync`.
  global_flags:
    - "--transfers=4"
    - "--checkers=8"
    - "--retries=3"
    - "--low-level-retries=10"
    - "--track-renames"

# --- pastas a sincronizar ---------------------------------------------------
# Cada item é uma "tarefa" independente. Adicione/remova entradas livremente.
#
# git_mode pode ser:
#   "off"    → bisync puro, sem nenhum tratamento especial
#   "bisync" → bisync + excludes automáticos de artefatos (node_modules, .venv, etc.)
#              Padrão. Recomendado para pastas com código (preserva worktree e .git).
#   "bundle" → empacota repos com `git bundle` (sobe só o histórico commitado).
#              Use só se você tem repos com .git/ muito grande e o custo de
#              sincronizar arquivo a arquivo for proibitivo.
folders:
  - name: "documentos"
    local_path: "~/Documentos"
    remote_subpath: "Documentos"
    enabled: true
    git_mode: "off"                    # papelada não é código
    auto_exclude: false                # nada de presets aqui
    exclude:
      - "*.tmp"
      - "~$*"
    debounce_seconds: 5

  - name: "projetos"
    local_path: "~/Projetos"
    remote_subpath: "Projetos"
    enabled: true
    git_mode: "bisync"                 # worktree + .git, sem build artifacts
    auto_exclude: true                 # aplica excludes automáticos
    exclude:                           # extras específicos desta tarefa
      - "*.log"
    debounce_seconds: 10

# --- comportamento de Git ---------------------------------------------------
git:
  # Onde os bundles ficam armazenados localmente antes do upload.
  bundles_dir: "~/.cache/drive-sync/bundles"
  # Sufixo do arquivo bundle no Proton Drive (substitui a pasta inteira).
  bundle_suffix: ".gitbundle"
  # Inclui tudo (HEAD, branches, tags, stash) — equivalente a "git bundle create x --all".
  bundle_all: true
  # Procura repositórios Git aninhados (projetos dentro de projetos).
  recursive_detection: true
  # Profundidade máxima ao procurar .git aninhados (evita varreduras infinitas).
  max_recursion_depth: 6

# --- watcher / scheduler ----------------------------------------------------
watcher:
  # Tamanho da fila interna de eventos.
  queue_size: 1000
  # Quantos jobs de sync rodam em paralelo (cada pasta-tarefa é um job).
  max_concurrent_jobs: 3
  # Sincronização periódica de "rede de segurança" (em segundos). 0 = só por evento.
  periodic_full_sync_seconds: 1800
  # Atraso ao iniciar, dando tempo da rede subir após boot.
  startup_delay_seconds: 15

# --- deduplicação de subpastas ---------------------------------------------
dedupe:
  # Se uma pasta já está sob a varredura de outra tarefa, pula a sub.
  skip_subpaths_of_configured_folders: true

# --- logging ----------------------------------------------------------------
logging:
  level: "INFO"                              # DEBUG | INFO | WARNING | ERROR
  file: "~/.local/state/drive-sync/drive-sync.log"
  # Rotação por tamanho.
  max_bytes: 5242880                         # 5 MiB
  backup_count: 5                            # mantém 5 arquivos antigos comprimidos
  # Também ecoa no journal/console (útil com `journalctl --user -u drive-sync`).
  console: true
