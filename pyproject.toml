[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-sync"
version = "0.1.0"
description = "Sincronização bidirecional de pastas locais com Proton Drive (via rclone bisync)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Você" }]
dependencies = [
    "watchdog>=4.0",
    "PyYAML>=6.0",
]

[project.scripts]
drive-sync = "drive_sync.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["drive_sync*"]
